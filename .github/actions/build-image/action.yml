name: 'Build and push dotnet image'
description: '构建并推送单个 dotnet 国产系统镜像（含校验与签名）'
inputs:
  context:
    description: '构建上下文目录（如 ./src/runtime/9.0/uos/v20-1070a/amd64）'
    required: true
  image_repo:
    description: '镜像仓库（如 blueapple168/dotnet-uos/runtime）'
    required: true
  tag_name:
    description: '主 Tag（如 9.0）'
    required: true
  github_token:
    description: '用于 GHCR 登录的 token（组合 action 内无法使用 secrets 上下文，需从工作流传入）'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        qemu-version: latest
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver: docker-container
        driver-opts: |
          image=moby/buildkit:master
    - name: Login to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ inputs.image_repo }}
        tags: |
          type=raw,value=${{ inputs.tag_name }}
          type=raw,value=${{ inputs.tag_name }}-${{ github.sha }}
    - name: Build and push
      id: build-and-push
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=registry,ref=ghcr.io/${{ inputs.image_repo }}:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ inputs.image_repo }}:buildcache,mode=max
        build-args: |
          BUILDKIT_PROGRESS=plain
    - name: Print built image info
      shell: bash
      run: |
        IMG="ghcr.io/${{ inputs.image_repo }}:${{ inputs.tag_name }}"
        echo "Built image: ${IMG}"
        echo "With commit tag: ${IMG}-${{ github.sha }}"
        echo "Digest: ${{ steps.build-and-push.outputs.digest }}"
    - name: Validate amd64 container
      shell: bash
      run: |
        IMG="ghcr.io/${{ inputs.image_repo }}:${{ inputs.tag_name }}"
        docker run --rm --platform linux/amd64 "${IMG}" bash -c "echo 'amd64 container validation OK'"
    - name: Install cosign
      if: github.event_name != 'pull_request'
      uses: sigstore/cosign-installer@v3
    - name: Keyless Sign Image
      if: github.event_name != 'pull_request'
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: "1"
      run: |
        IMAGE_FULL="ghcr.io/${{ inputs.image_repo }}"
        DIGEST="${{ steps.build-and-push.outputs.digest }}"
        echo "Start signing ${IMAGE_FULL}@${DIGEST}"
        cosign sign --yes "${IMAGE_FULL}@${DIGEST}"
